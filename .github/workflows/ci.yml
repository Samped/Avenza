name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: avenza
          POSTGRES_DB: avenza
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U avenza"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      # Passwordless local CI Postgres (trust). Not a production credential.
      DATABASE_URL: postgresql://avenza@localhost:5432/avenza
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Generate ephemeral CI secrets
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "AVENZA_FIELD_ENCRYPTION_KEY=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run db:generate
      - run: npm run build -w @avenza/shared
      - run: npm run build -w @avenza/chain
      - run: npm test
      - run: npm run contracts:build
      - run: npm run contracts:test
      - run: npm run circuits:test
