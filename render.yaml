# AVENZA on Render — API + worker + Postgres + Redis
# Blueprint: https://dashboard.render.com/blueprints
#
# After create:
# 1. Set secret env group values (RELAYER_PRIVATE_KEY, JWT_SECRET, ENCRYPTION_KEY, …)
# 2. Deploy Vercel web with NEXT_PUBLIC_API_URL=https://<avenza-api>.onrender.com/api/v1
# 3. Set APP_URL + CORS_ORIGINS on API to the Vercel URL
# 4. Fund RELAYER with OKB; deposit native USDC to BusinessTreasury

previewsEnabled: false

databases:
  - name: avenza-db
    plan: basic-256mb
    databaseName: avenza
    user: avenza
    postgresMajorVersion: "16"

services:
  - type: keyvalue
    name: avenza-redis
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: avenza-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    plan: starter
    region: oregon
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: ENABLE_SWAGGER
        value: "false"
      - key: API_RATE_LIMIT_PER_MIN
        value: "60"
      - key: XLAYER_CHAIN_ID
        value: "196"
      - key: XLAYER_RPC_URL
        value: https://rpc.xlayer.tech
      - key: USDC_TOKEN_ADDRESS
        value: "0xB6CEceAB302E2E4948951eE7843FC24E92933061"
      - key: REQUIRED_CONFIRMATIONS
        value: "3"
      - key: ALLOW_TAPEOUT_LOCAL_FALLBACK
        value: "false"
      - key: ALLOW_SIMULATED_SETTLEMENT
        value: "false"
      - key: TAPEOUT_EVAL_CHAIN_ID
        value: "196"
      - key: TAPEOUT_RPC_URL
        value: https://rpc.xlayer.tech
      - key: TAPEOUT_FACTORY_ADDRESS
        value: "0x1f09daefa827f02cbb40967cc91b259763760761"
      - key: TAPEOUT_PROCESSOR_ADDRESS
        value: "0xB04EB79D1A5EECaabAAfF7B77d7c27578EE693FF"
      - key: TAPEOUT_PAYMENT_LIMIT_CIRCUIT_ID
        value: "1"
      - key: SETTLEMENT_TAPEOUT_PROCESSOR_ADDRESS
        value: "0xB04EB79D1A5EECaabAAfF7B77d7c27578EE693FF"
      - key: EMERGENCY_CONTROL_ADDRESS
        value: "0xcc5661D1471e9e61B37Df5Ad5D2E1B2C5578c884"
      - key: ORGANIZATION_REGISTRY_ADDRESS
        value: "0xD2445389196f2c502AB5ec6f49a90cc04BB71ff5"
      - key: VENDOR_REGISTRY_ADDRESS
        value: "0x3dE7a4C348F7415087a9Cf58FBC57256bAF1eb4b"
      - key: PAYMENT_POLICY_REGISTRY_ADDRESS
        value: "0x0Af7a5DDE4f2B30772eE60F80EfD516A94C56A52"
      - key: CONTROLS_REGISTRY_ADDRESS
        value: "0xF10cDEB14604F6311195dA90B6076713f7f42f14"
      - key: PAYMENT_AUTHORIZATION_ADDRESS
        value: "0x96778c369D85aaCCBF6DE0BcD0671B048E16E5CA"
      - key: PAYMENT_ROUTER_ADDRESS
        value: "0xE3F25b5e9Da3dFA72C0a12f05fd45cc0dD4243dD"
      - key: TREASURY_ADDRESS
        value: "0x951adC47425FB4441A3D057d3e10Fa5D4eC27Ed1"
      - key: AUDIT_REGISTRY_ADDRESS
        value: "0xEc114e0B3d39CaFEBE9d9aC25932A75958A7fbDC"
      - key: ORGANIZATION_ONCHAIN_ID
        value: "0x603fd1000e3f9b350efdfbeaad5864a151b4bdac12228b5056569a9b2478f82a"
      - key: PLATFORM_FEE_BPS
        value: "30"
      - key: PLATFORM_FEE_FLAT_MINOR
        value: "50000"
      - key: GAS_RECOVERY_USDC_MINOR
        value: "150000"
      - key: DATABASE_URL
        fromDatabase:
          name: avenza-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: avenza-redis
          type: keyvalue
          property: connectionString
      # Secrets — set in Render dashboard / env group (do not commit values)
      - key: JWT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: AVENZA_FIELD_ENCRYPTION_KEY
        sync: false
      - key: INTERNAL_WEBHOOK_TOKEN
        sync: false
      - key: RELAYER_PRIVATE_KEY
        sync: false
      - key: REGISTRY_OWNER_PRIVATE_KEY
        sync: false
      - key: PLATFORM_FEE_RECIPIENT
        sync: false
      - key: APP_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: API_URL
        sync: false

  - type: worker
    name: avenza-worker
    runtime: docker
    dockerfilePath: ./Dockerfile.worker
    dockerContext: .
    plan: starter
    region: oregon
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: REDIS_URL
        fromService:
          name: avenza-redis
          type: keyvalue
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: avenza-db
          property: connectionString
      - key: INTERNAL_WEBHOOK_TOKEN
        sync: false
      - key: API_URL
        sync: false
