services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: avenza
      POSTGRES_DB: avenza
      # Local-only: no password in repo (avoids secret scanners). Do not use on public networks.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - avenza_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avenza"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-avenza}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in your .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - avenza_minio:/data

volumes:
  avenza_pg:
  avenza_minio:
