# Public hackathon demo stack
# Usage: docker compose -f docker-compose.demo.yml up --build
# Requires .env with DATABASE credentials if you override trust defaults.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: avenza
      POSTGRES_DB: avenza
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - avenza_demo_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avenza"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://avenza@postgres:5432/avenza
      REDIS_URL: redis://redis:6379
      API_PORT: "3001"
      APP_URL: ${APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  avenza_demo_pg:
